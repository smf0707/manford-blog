<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>旅游目的地地图 · 项目2</title>
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    :root {
      /* 仅保留博客 styles.css 未定义的专有变量；其余 design token 复用博客 :root */
      --up: #ff5b6e;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    html {
      background: #0a0e1a
    }

    body {
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    /* ===== 顶栏（仿股票行情小程序：品牌返回博客首页） ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--hairline);
      background: var(--menu-bg);
      transition: background .45s ease, border-color .45s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: .4px;
      color: var(--text);
      text-decoration: none
    }

    .brand .logo {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--violet), #ec4899);
      color: #fff
    }

    .brand .logo svg {
      width: 16px;
      height: 16px
    }

    .brand small {
      display: block;
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 2px
    }

    .topbar .links {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--muted)
    }

    .topbar .links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s
    }

    .topbar .links a:hover {
      color: var(--text)
    }

    /* ===== 旅游目的地地图（项目二） ===== */
    .travel {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 16px 28px
    }

    .t-search {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px
    }

    .t-sel,
    .t-in {
      flex: 1;
      min-width: 130px;
      height: 44px;
      border: 1px solid var(--hairline);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 14px;
      font-family: var(--font);
      outline: none
    }

    .t-sel {
      appearance: none;
      -webkit-appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 16px) 19px, calc(100% - 11px) 19px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 30px
    }

    .t-in::placeholder {
      color: rgba(148,163,184,0.6)
    }

    .t-go {
      height: 44px;
      padding: 0 22px;
      border: none;
      background: linear-gradient(135deg, var(--violet), #a06bff);
      color: #fff;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      white-space: nowrap
    }

    .t-go:active {
      transform: translateY(1px)
    }

    .t-sub {
      color: var(--muted);
      font-size: 13px;
      margin: 2px 2px 12px;
      letter-spacing: .3px
    }

    .t-more {
      align-self: center;
      margin: 4px auto 0;
      padding: 9px 22px;
      border: 1px solid var(--hairline);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: border-color .2s, background .2s
    }

    .t-more:hover { border-color: var(--violet); background: var(--glass-strong); }

    .t-body {
      display: flex;
      gap: 16px;
      align-items: flex-start
    }

    .t-list {
      flex: 0 0 366px;
      max-width: 366px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .t-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      background: #ffffff;
      color: #1d2433;
      border: 1px solid rgba(20, 24, 40, .1);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color .15s, transform .15s, box-shadow .15s;
      min-height: 64px
    }

    .t-item:hover,
    .t-item.active {
      border-color: var(--violet);
      box-shadow: 0 6px 18px rgba(124, 92, 255, .18);
      transform: translateX(2px)
    }

    .t-rank {
      flex: 0 0 26px;
      height: 26px;
      line-height: 26px;
      text-align: center;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      background: linear-gradient(135deg, var(--violet), #a06bff);
      color: #fff;
      font-family: var(--mono)
    }

    .t-info {
      flex: 1;
      min-width: 0
    }

    .t-name {
      font-size: 15px;
      font-weight: 600;
      color: #1f2733;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .t-city {
      font-size: 11px;
      color: rgba(45, 53, 77, .88);
      font-weight: 400;
      background: rgba(20, 24, 40, .05);
      border: 1px solid rgba(20, 24, 40, .1);
      padding: 1px 7px;
      border-radius: 6px
    }

    .t-desc {
      font-size: 12px;
      color: rgba(70, 80, 105, .92);
      margin-top: 4px;
      line-height: 1.5;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical
    }

    .t-heat {
      flex: 0 0 88px;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 5px
    }

    .t-heat b {
      font-family: var(--mono);
      font-size: 16px;
      color: var(--up)
    }

    .t-bar {
      display: block;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: var(--glass-strong);
      overflow: hidden;
      position: relative
    }

    .t-bar::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--w, 50%);
      background: linear-gradient(90deg, #ff8a8a, var(--up));
      border-radius: 3px
    }

    .t-empty {
      padding: 30px;
      text-align: center;
      color: rgba(70, 80, 105, .92);
      background: #fff;
      border: 1px dashed rgba(20, 24, 40, .14);
      border-radius: 12px
    }

    .t-mapwrap {
      flex: 1;
      min-width: 0;
      position: relative;
      height: 64vh;
      min-height: 420px;
      background: var(--glass-strong);
      border: 1px solid var(--hairline);
      border-radius: 14px;
      overflow: hidden
    }

    #tMap {
      width: 100%;
      height: 100%
    }

    .t-pin {
      line-height: 0;
      cursor: pointer;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .45));
      transition: transform .12s
    }

    .t-pin:hover {
      transform: scale(1.14)
    }

    .t-info-win {
      padding: 4px 6px;
      max-width: 240px
    }

    .t-info-win .tt-name {
      color: #161a22;
      font-size: 14px;
      font-weight: 700
    }

    .t-info-win .tt-meta {
      color: #7c3aed;
      font-size: 11px;
      margin: 3px 0 5px;
      font-family: var(--mono)
    }

    .t-info-win .tt-desc {
      color: #555;
      font-size: 12px;
      line-height: 1.5
    }

    .t-mapnotice {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      color: var(--muted);
      padding: 24px
    }

    .t-mapnotice .mn-ic {
      width: 42px;
      height: 42px;
      color: var(--violet)
    }

    .t-mapnotice p {
      margin: 0;
      font-size: 14px
    }

    .t-mapnotice .mn-sub {
      font-size: 12px;
      color: rgba(148,163,184,0.6);
      max-width: 330px;
      line-height: 1.6
    }

    .t-retry {
      margin-top: 6px;
      padding: 9px 22px;
      border: none;
      background: linear-gradient(135deg, var(--violet), #a06bff);
      color: #fff;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      white-space: nowrap
    }

    .t-retry:active { transform: translateY(1px); }

    .t-maphint {
      position: absolute;
      left: 10px;
      bottom: 8px;
      font-size: 11px;
      color: #cfd6e6;
      background: rgba(12, 16, 24, .55);
      padding: 3px 8px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 3
    }

    .t-foot {
      margin-top: 14px;
      text-align: center;
      color: rgba(148,163,184,0.6);
      font-size: 12px;
      letter-spacing: .3px
    }

    @media (max-width:780px) {
      .t-search {
        gap: 8px
      }

      .t-sel {
        flex: 1 1 0;
        min-width: 0
      }

      .t-in {
        flex: 1 1 auto;
        min-width: 0
      }

      .t-go {
        flex: 0 0 auto
      }

      .t-sel,
      .t-in,
      .t-go {
        height: 38px;
        font-size: 13px
      }

      .t-body {
        flex-direction: column
      }

      .t-list {
        flex: none;
        max-width: none;
        width: 100%
      }

      .t-mapwrap {
        width: 100%;
        height: 56vh
      }
    }
  </style>
</head>

<body>
  <div class="bg-aurora"></div>
  <div class="bg-grain"></div>
  <header class="topbar">
    <a class="brand" href="https://smf0707.github.io/manford-blog/">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M3 17l5-5 4 4 7-8" />
          <path d="M14 8h5v5" />
        </svg>
      </span>
      <span>旅游目的地地图<small>MANFORD · 小程序</small></span>
    </a>
    <div class="links">
      <a href="https://smf0707.github.io/manford-blog/">&larr; 返回博客</a>
    </div>
  </header>

  <main class="travel">
    <div class="t-search">
      <select id="tProv" class="t-sel" aria-label="选择省份"></select>
      <select id="tCity" class="t-sel" aria-label="选择城市"></select>
      <select id="tDist" class="t-sel" aria-label="选择区县"></select>
      <input id="tInput" class="t-in" type="text" placeholder="或输入 省份 / 市 / 区，如：广东、广东 广州、广州 番禺" />
      <button id="tGo" class="t-go">搜索</button>
    </div>
    <div class="t-sub" id="tSub">全国最热门目的地</div>
    <div class="t-body">
      <div class="t-list" id="tList"></div>
      <div class="t-mapwrap">
        <div id="tMap"></div>
        <div class="t-maphint">拖动平移 · 滚轮 / 双指缩放 · 点击标记看简介</div>
      </div>
    </div>
    <footer class="t-foot">数据基于公开资料整理，仅作演示参考</footer>
  </main>

  <script src="travel-data.js"></script>
  <script src="travel-dist.js"></script>
  <script>
    /* 高德地图 Web 端 JS API 密钥（必填）
       获取：高德开放平台 console.amap.com → 应用管理 → 创建应用 → 添加 Key
       → 服务平台选「Web端(JS API)」→ 得到 key 与 安全密钥(securityJsCode)
       把下面的占位替换成你自己的即可。 */
    /* 同步博客皮肤：读取博客存的主题（nebula-theme）并应用，实现皮肤联动 */
    try {
      var _t = localStorage.getItem('nebula-theme');
      if (_t && _t !== 'dark') document.documentElement.setAttribute('data-theme', _t);
    } catch (e) {}

    var AMAP_KEY = '240b76a8767e420891ee663673bab5b5';
    var AMAP_SECRET = '0f7c5b9c7cf3c729834c45c0bfcc168e';

    var Travel = {
      data: null,
      provSel: null, citySel: null, input: null, list: null, mapEl: null, sub: null,
      map: null, markers: null, info: null, results: [],
      cleanName: function (p) { return (p || '').replace(/(省|市|自治区|特别行政区|壮族|回族|维吾尔)/g, ''); },
      init: function () {
        var self = this;
        this.data = (window.TRAVEL_DATA || []).map(function (d) {
          d.dist = (window.TRAVEL_DIST && window.TRAVEL_DIST[d.name]) || d.city || '';
          return d;
        });
        this.expanded = false;
        this.provSel = document.getElementById('tProv');
        this.citySel = document.getElementById('tCity');
        this.distSel = document.getElementById('tDist');
        this.input = document.getElementById('tInput');
        this.list = document.getElementById('tList');
        this.mapEl = document.getElementById('tMap');
        this.sub = document.getElementById('tSub');
        if (!this.mapEl) return;
        this.fillProv();
        this.onProv();
        this.provSel.addEventListener('change', function () { self.onProv(); self.search(); });
        this.citySel.addEventListener('change', function () { self.onCity(); self.search(); });
        this.distSel.addEventListener('change', function () { self.search(); });
        document.getElementById('tGo').addEventListener('click', function () { self.search(); });
        this.input.addEventListener('keydown', function (e) { if (e.key === 'Enter') self.search(); });
        this.search();
      },
      fillProv: function () {
        var seen = {}, provs = [];
        this.data.forEach(function (d) { if (!seen[d.prov]) { seen[d.prov] = 1; provs.push(d.prov); } });
        this.provSel.innerHTML = '<option value="">全部省份</option>' + provs.map(function (p) {
          return '<option value="' + p + '">' + Travel.cleanName(p) + '</option>';
        }).join('');
      },
      onProv: function () {
        var pv = this.provSel.value, seen = {}, cities = [];
        this.data.forEach(function (d) { if ((!pv || d.prov === pv) && !seen[d.city]) { seen[d.city] = 1; cities.push(d.city); } });
        this.citySel.innerHTML = '<option value="">全部城市</option>' + cities.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
        this.citySel.value = '';
        this.onCity();
      },
      onCity: function () {
        var pv = this.provSel.value, cv = this.citySel.value;
        if (!pv && !cv) { this.distSel.innerHTML = '<option value="">全部区县</option>'; this.distSel.value = ''; return; }
        var seen = {}, dists = [];
        this.data.forEach(function (d) {
          if ((!pv || d.prov === pv) && (!cv || d.city === cv) && d.dist && !seen[d.dist]) { seen[d.dist] = 1; dists.push(d.dist); }
        });
        dists.sort();
        this.distSel.innerHTML = '<option value="">全部区县</option>' + dists.map(function (x) { return '<option value="' + x + '">' + x + '</option>'; }).join('');
        this.distSel.value = '';
      },
      parseInput: function () {
        var raw = (this.input.value || '').trim();
        var prov = this.provSel.value, city = this.citySel.value, dist = this.distSel.value;
        if (raw) {
          var parts = raw.split(/\s+/), p0 = parts[0], hitP = '', hitC = '';
          this.data.forEach(function (d) {
            if (d.prov.indexOf(p0) >= 0) hitP = d.prov;
            else { var cn = Travel.cleanName(d.prov); if (cn && p0.indexOf(cn) >= 0) hitP = d.prov; }
            if (d.city.indexOf(p0) >= 0) hitC = d.city;
          });
          if (hitP) {
            prov = hitP;
            if (parts[1]) city = parts[1];
            if (parts[2]) dist = parts[2];
          } else if (hitC) {
            city = hitC;
            if (parts[1]) dist = parts[1];
          }
        }
        return { prov: prov, city: city, dist: dist };
      },
      search: function () {
        this.expanded = false;
        var q = this.parseInput();
        var r = this.data.filter(function (d) {
          if (q.prov && d.prov !== q.prov) return false;
          if (q.city && d.city.indexOf(q.city) < 0) return false;
          if (q.dist && d.dist.indexOf(q.dist) < 0) return false;
          return true;
        });
        r.sort(function (a, b) { return b.heat - a.heat; });
        var top = r.slice(0, 20);
        this.results = top;
        this.lastQ = q; this.lastTotal = r.length;
        this.renderList(top, q, r.length);
        if (this.map) this.addMarkers(top);
      },
      renderList: function (top, q, total) {
        var self = this;
        var p = Travel.cleanName(q.prov || (this.provSel.value ? this.provSel.value : ''));
        var head = !q.prov ? '全国最热门目的地' : (p + (q.city ? ' · ' + q.city : '') + (q.dist ? ' · ' + q.dist : ''));
        this.sub.textContent = head + ' · 共 ' + total + ' 个，按热度展示前 ' + Math.min(top.length, 20);
        if (!top.length) { this.list.innerHTML = '<div class="t-empty">未找到匹配的旅游目的地，试试其他省份 / 城市 / 区县</div>'; return; }
        var limit = (this.expanded || top.length <= 10) ? top.length : 10;
        this.list.innerHTML = top.slice(0, limit).map(function (d, i) {
          var pp = Travel.cleanName(d.prov);
          var tag = pp + '·' + d.city + (d.dist && d.dist !== d.city ? '·' + d.dist : '');
          return '<div class="t-item" data-i="' + i + '">'
            + '<div class="t-rank">' + (i + 1) + '</div>'
            + '<div class="t-info"><div class="t-name">' + d.name + ' <span class="t-city">' + tag + '</span></div>'
            + '<div class="t-desc">' + d.desc + '</div></div>'
            + '<div class="t-heat"><span class="t-bar" style="--w:' + d.heat + '%"></span><b>' + d.heat + '</b></div>'
            + '</div>';
        }).join('');
        if (top.length > 10) {
          var left = top.length - 10;
          this.list.innerHTML += '<button class="t-more" id="tMore">' + (this.expanded ? '收起' : ('展开剩余 ' + left + ' 个')) + '</button>';
          document.getElementById('tMore').addEventListener('click', function () { self.expanded = !self.expanded; self.renderList(self.results, self.lastQ, self.lastTotal); });
        }
        Array.prototype.forEach.call(this.list.querySelectorAll('.t-item'), function (el) {
          el.addEventListener('click', function () { self.focusPoint(parseInt(el.dataset.i, 10)); });
        });
      },
      /* ===== 高德地图 ===== */
      mapReady: function () {
        var self = this;
        if (this.map) return;
        this.map = new AMap.Map(this.mapEl, { zoom: 5, center: [104, 36], viewMode: '2D', mapStyle: 'amap://styles/normal', resizeEnable: true });
        this.map.on('click', function () { if (self.info) self.info.close(); });
        if (this.results.length) this.addMarkers(this.results);
      },
      addMarkers: function (list) {
        if (!this.map || !list || !list.length) return;
        if (this.markers) this.map.remove(this.markers);
        var self = this;
        this.markers = list.map(function (d, i) {
          var mk = new AMap.Marker({
            position: [d.lng, d.lat],
            content: self.pinHTML(d),
            offset: new AMap.Pixel(-13, -34),
            zIndex: 100 + i,
            title: d.name
          });
          mk.on('click', function () { self.openInfo(d, mk); });
          self.map.add(mk);
          return mk;
        });
        this.map.setFitView(this.markers, false, [50, 50, 50, 50], 14);
      },
      pinHTML: function (d) {
        var c = this.pinColor(d.heat);
        return '<div class="t-pin" style="--c:' + c + '">'
          + '<svg width="26" height="34" viewBox="0 0 26 34" xmlns="http://www.w3.org/2000/svg">'
          + '<path d="M13 0C5.8 0 0 5.8 0 13c0 9.2 13 21 13 21s13-11.8 13-21C26 5.8 20.2 0 13 0z" fill="' + c + '" stroke="#fff" stroke-width="1.6"/>'
          + '<circle cx="13" cy="13" r="5" fill="#fff"/></svg></div>';
      },
      pinColor: function (h) { var L = 58 - h * 0.30; return 'hsl(2,88%,' + L.toFixed(0) + '%)'; },
      openInfo: function (d, mk) {
        if (!this.map) return;
        if (!this.info) this.info = new AMap.InfoWindow({ offset: new AMap.Pixel(0, -32) });
        this.info.setContent('<div class="t-info-win"><div class="tt-name">' + d.name + '</div><div class="tt-meta">' + Travel.cleanName(d.prov) + '·' + d.city + ' · 热度 ' + d.heat + '</div><div class="tt-desc">' + d.desc + '</div></div>');
        this.info.open(this.map, mk.getPosition());
      },
      focusPoint: function (i) {
        var d = this.results[i]; if (!d) return;
        if (this.map) this.map.setZoomAndCenter(17, [d.lng, d.lat]);   // 街道 / 建筑级
        if (this.markers && this.markers[i]) this.openInfo(d, this.markers[i]);
      },
      showNotice: function () {
        if (!this.mapEl) return;
        this.mapEl.innerHTML = '<div class="t-mapnotice">'
          + '<span class="mn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>'
          + '<p>地图需要配置高德地图 Key</p>'
          + '<p class="mn-sub">在 miniapp/p2/index.html 顶部把 AMAP_KEY / AMAP_SECRET 换成你自己的「Web 端 JS API」密钥（高德开放平台获取），地图即可显示并可缩放到街道建筑级。</p>'
          + '</div>';
      },
      showLoadFail: function () {
        if (!this.mapEl) return;
        var self = this;
        this.mapEl.innerHTML = '<div class="t-mapnotice">'
          + '<span class="mn-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>'
          + '<p>地图加载失败或网络受限</p>'
          + '<p class="mn-sub">当前网络（如手机流量）可能无法访问高德地图服务，或加载较慢。建议切换到 WiFi 后点下方「重新加载」；若在 App 内置浏览器打开，请用系统浏览器打开本页。</p>'
          + '<button class="t-retry" id="tRetry">重新加载</button>'
          + '</div>';
        var btn = document.getElementById('tRetry');
        if (btn) btn.addEventListener('click', function () {
          self.mapEl.innerHTML = '';
          if (window.AMap && self.map) { try { self.map.destroy(); } catch (e) {} self.map = null; self.markers = null; }
          loadAmap();
        });
      }
    };

    function loadAmap() {
      if (!AMAP_KEY || AMAP_KEY.indexOf('YOUR_') === 0) { Travel.showNotice(); return; }
      window._AMapSecurityConfig = { securityJsCode: AMAP_SECRET };
      if (window.__amapTimer) clearTimeout(window.__amapTimer);
      window.__amapTimer = setTimeout(function () { if (!window.AMap) Travel.showLoadFail(); }, 15000);
      window.__onAmapReady = function () { clearTimeout(window.__amapTimer); Travel.mapReady(); };
      var s = document.createElement('script');
      s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(AMAP_KEY) + '&callback=__onAmapReady&_=' + Date.now();
      s.async = true; document.head.appendChild(s);
    }

    document.addEventListener('DOMContentLoaded', function () { Travel.init(); loadAmap(); });
  </script>
</body>

</html>
