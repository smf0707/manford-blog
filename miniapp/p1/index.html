<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>股票行情 · 在线 K 线查看器</title>
<meta name="description" content="在线查看 A 股行情，支持日 K、周 K、月 K 蜡烛图与开盘价、收盘价、最高价、最低价等详情。数据来自东方财富。">
<style>
  :root{
    --bg:#0a0d14;
    --bg2:#0f141f;
    --panel:#11161f;
    --panel2:#0c111a;
    --line:#1d2533;
    --text:#e6ebf2;
    --muted:#8a93a6;
    --muted2:#5d6678;
    --up:#ef232a;       /* 红涨 */
    --down:#00b070;     /* 绿跌 */
    --ma5:#f5c542;
    --ma10:#c77dff;
    --ma20:#4dabf7;
    --accent:#7c5cff;
    --radius:14px;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--text);
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(124,92,255,.14), transparent 60%),
      radial-gradient(900px 600px at 0% 0%, rgba(0,176,112,.08), transparent 55%),
      var(--bg);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .up{color:var(--up)!important}
  .down{color:var(--down)!important}

  /* 顶栏 */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:rgba(12,16,24,.72);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.4px}
  .brand .logo{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),#ec4899);color:#fff}
  .brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:2px}
  .topbar .links{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
  .topbar .links a{display:inline-flex;align-items:center;gap:6px;transition:color .2s}
  .topbar .links a:hover{color:var(--text)}
  .status{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 11px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted)}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--down)}
  .status.live .dot{background:var(--down);box-shadow:0 0 0 3px rgba(0,176,112,.18)}
  .status.demo .dot{background:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.18)}
  .status.closed .dot{background:var(--muted2);box-shadow:none}
  .status.live #statusText::after{content:'';display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;
    background:var(--down);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  .wrap{max-width:1180px;margin:0 auto;padding:20px 22px 48px}

  /* 选择器 */
  .selector{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:8px 10px;min-width:260px}
  .search svg{width:18px;height:18px;color:var(--muted)}
  .search input{background:transparent;border:0;outline:0;color:var(--text);font-size:15px;width:150px;font-family:var(--mono)}
  .search button{border:0;background:linear-gradient(135deg,var(--accent),#ec4899);color:#fff;
    padding:7px 14px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px}
  .search button:active{transform:translateY(1px)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;transition:.18s;white-space:nowrap}
  .chip:hover{color:var(--text);border-color:#324056}
  .chip.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--accent),#ec4899)}

  /* 报价头 */
  .quote{display:flex;flex-wrap:wrap;align-items:flex-end;gap:26px;padding:20px 22px;
    background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:16px}
  .q-id .q-name{font-size:24px;font-weight:800;letter-spacing:.5px}
  .q-id .q-code{font-size:13px;color:var(--muted);font-family:var(--mono);margin-top:4px}
  .q-id .mkt{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);
    border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:middle}
  .q-main{display:flex;align-items:flex-end;gap:18px;margin-left:auto}
  .q-price{font-size:42px;font-weight:800;font-family:var(--mono);line-height:1;letter-spacing:-1px}
  .q-chg{font-size:16px;font-weight:700;font-family:var(--mono);margin-bottom:5px}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
  .stat{background:var(--panel);padding:13px 16px;display:flex;flex-direction:column;gap:6px}
  .stat .s-label{font-size:12px;color:var(--muted)}
  .stat .s-val{font-size:16px;font-weight:700;font-family:var(--mono)}

  /* 图表控件 */
  .controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .ctrl-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px}
  .tab{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;
    padding:7px 18px;border-radius:8px;cursor:pointer;transition:.18s}
  .tab.active{color:#fff;background:linear-gradient(135deg,var(--accent),#ec4899)}
  .mas{display:inline-flex;gap:8px}
  .ma-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);
    border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;transition:.18s}
  .ma-btn .sw{width:14px;height:3px;border-radius:2px}
  .ma-btn.off{opacity:.4}
  .note{font-size:12px;color:var(--muted2);margin-left:auto}

  /* 图表 */
  .chart-wrap{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
    padding:6px;overflow:hidden}
  #chart{display:block;width:100%;height:560px}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,13,20,.6);backdrop-filter:blur(2px);font-size:14px;color:var(--muted);z-index:5}
  .overlay.show{display:flex}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tip{position:absolute;z-index:8;pointer-events:none;min-width:172px;display:none;
    background:rgba(17,22,31,.96);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .tip.show{display:block}
  .tip .t-date{font-family:var(--mono);color:var(--text);font-size:12px;margin-bottom:7px;font-weight:700}
  .tip .t-grid{display:grid;grid-template-columns:auto auto;gap:3px 14px;font-family:var(--mono)}
  .tip .t-grid span{color:var(--muted)}
  .tip .t-grid b{font-weight:700;text-align:right}
  #chart{cursor:crosshair}
  .chart-wrap.dragging #chart{cursor:grabbing}
  .chart-toolbar{position:absolute;top:12px;right:14px;display:flex;gap:6px;z-index:7}
  .ct-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;
    background:rgba(20,26,36,.82);border:1px solid var(--line);color:var(--text);cursor:pointer;
    font-size:17px;line-height:1;font-family:var(--mono);transition:.15s;user-select:none}
  .ct-btn:hover{border-color:var(--accent);background:rgba(32,40,54,.94)}
  .ct-btn:active{transform:scale(.9)}
  .chart-hint{position:absolute;left:14px;bottom:10px;z-index:6;font-size:11px;color:var(--muted2);
    background:rgba(10,13,20,.45);padding:3px 8px;border-radius:6px;pointer-events:none}

  .foot{margin-top:18px;font-size:12px;color:var(--muted2);line-height:1.7;text-align:center}
  .foot a{color:var(--muted)}

  /* 主导航 */
  .mainnav{display:flex;gap:6px;margin-bottom:18px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:5px;width:fit-content}
  .mnav-btn{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;
    padding:9px 22px;border-radius:9px;cursor:pointer;transition:.18s}
  .mnav-btn:hover{color:var(--text)}
  .mnav-btn.active{color:#fff;background:linear-gradient(135deg,var(--accent),#ec4899)}
  .view.hidden{display:none}

  /* 行情标题行（名称 + 加自选） */
  .q-title-row{display:flex;align-items:center;gap:14px}
  .watch-btn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;
    border:1px solid var(--accent);color:var(--accent);background:transparent;transition:.18s;white-space:nowrap}
  .watch-btn:hover{background:rgba(124,92,255,.12)}
  .watch-btn.in{border-color:var(--muted2);color:var(--muted);background:transparent}
  .watch-btn.in:hover{background:rgba(138,147,166,.1)}

  /* chip 删除角标 */
  .chip{position:relative}
  .chip .del{position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;
    background:var(--up);color:#fff;font-size:12px;line-height:15px;text-align:center;cursor:pointer;
    display:none;border:2px solid var(--bg);font-weight:700}
  .chip:hover .del{display:block}
  .chip .del:hover{transform:scale(1.18)}

  /* 市场 / 自选 卡片与表格 */
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
  .card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
  .card h3 .sub{font-size:12px;color:var(--muted);font-weight:500}
  .mkt-table{width:100%;border-collapse:collapse;font-size:13px}
  .mkt-table th,.mkt-table td{padding:10px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05)}
  .mkt-table thead th{color:var(--muted);font-weight:600;user-select:none;white-space:nowrap;position:relative}
  .mkt-table th.sortable{cursor:pointer}
  .mkt-table th.sortable:hover{color:var(--text)}
  .mkt-table th.active{color:var(--text)}
  .mkt-table th .arrow{font-size:10px;margin-left:3px;color:var(--accent)}
  .mkt-table td.num{text-align:right;font-family:var(--mono)}
  .mkt-table .rank{color:var(--muted2);font-family:var(--mono);width:36px;text-align:center}
  /* 市场栏目：表头与单元格全部居中对齐（不影响自选表格） */
  #view-market .mkt-table th, #view-market .mkt-table td{text-align:center}
  #view-market .mkt-table td.num{text-align:center}
  .mkt-table .t-name{font-weight:600}
  .mkt-table tbody tr.nav{cursor:pointer;transition:background .15s}
  .mkt-table tbody tr.nav:hover{background:rgba(124,92,255,.09)}
  .mkt-table tbody tr.tbl-empty:hover{background:transparent}
  .cancel-sort{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;
    padding:3px 8px;cursor:pointer;background:var(--panel2);transition:.15s}
  .cancel-sort:hover{color:var(--text);border-color:var(--accent)}
  .expand-row td{text-align:center;color:var(--muted);cursor:pointer;font-size:12px}
  .expand-row:hover td{color:var(--text)}
  .tbl-empty td{text-align:center;color:var(--muted);padding:26px}
  .row-del{display:inline-block;width:20px;height:20px;line-height:18px;text-align:center;border-radius:6px;
    color:var(--muted);border:1px solid var(--line);cursor:pointer;font-size:14px;transition:.15s}
  .row-del:hover{color:#fff;background:var(--up);border-color:var(--up)}

  @media(max-width:760px){
    .q-main{margin-left:0;width:100%;justify-content:space-between}
    .q-price{font-size:34px}
    .stats{grid-template-columns:repeat(2,1fr)}
    #chart{height:430px}
    .wrap{padding:16px 14px 40px}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://smf0707.github.io/manford-blog/">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 7-8"/><path d="M14 8h5v5"/></svg>
      </span>
      <span>股票行情<small>MANFORD · 小程序</small></span>
    </a>
    <div class="links">
      <a href="https://smf0707.github.io/manford-blog/">&larr; 返回博客</a>
      <span class="status" id="status"><span class="dot"></span><span id="statusText">加载中</span></span>
    </div>
  </header>

  <div class="wrap">
    <!-- 主导航 -->
    <nav class="mainnav" id="mainnav">
      <button class="mnav-btn active" data-view="quote">行情</button>
      <button class="mnav-btn" data-view="market">市场</button>
      <button class="mnav-btn" data-view="watch">自选股</button>
    </nav>

    <!-- 行情视图（K线 + 搜索） -->
    <section id="view-quote" class="view">
    <!-- 选择器 -->
    <div class="selector">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="codeInput" type="text" inputmode="numeric" maxlength="6" placeholder="输入6位代码，如 600519" />
        <button id="queryBtn">查询</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <!-- 报价头 -->
    <div class="quote">
      <div class="q-id">
        <div class="q-title-row">
          <div class="q-name" id="qName">--</div>
          <button class="watch-btn" id="watchBtn">加自选</button>
        </div>
        <div class="q-code" id="qCode">-- <span class="mkt" id="qMkt"></span></div>
      </div>
      <div class="q-main">
        <div class="q-chg" id="qChg">--</div>
        <div class="q-price" id="qPrice">--</div>
      </div>
    </div>

    <!-- 指标 -->
    <div class="stats" id="stats"></div>

    <!-- 图表控件 -->
    <div class="controls">
      <div class="ctrl-left">
        <div class="tabs" id="tabs">
          <button class="tab" data-range="min">分时</button>
          <button class="tab active" data-range="day">日 K</button>
          <button class="tab" data-range="week">周 K</button>
          <button class="tab" data-range="month">月 K</button>
        </div>
        <div class="tabs" id="fqtTabs" title="复权方式">
          <button class="tab" data-fqt="0">不复权</button>
          <button class="tab active" data-fqt="1">前复权</button>
          <button class="tab" data-fqt="2">后复权</button>
        </div>
      </div>
      <div class="mas" id="mas">
        <button class="ma-btn" data-ma="5"><span class="sw" style="background:var(--ma5)"></span>MA5</button>
        <button class="ma-btn" data-ma="10"><span class="sw" style="background:var(--ma10)"></span>MA10</button>
        <button class="ma-btn" data-ma="20"><span class="sw" style="background:var(--ma20)"></span>MA20</button>
      </div>
      <span class="note">红涨绿跌 · 数据来源 东方财富</span>
    </div>

    <!-- 图表 -->
    <div class="chart-wrap" id="chartWrap">
      <canvas id="chart"></canvas>
      <div class="tip" id="tip"></div>
      <div class="chart-toolbar">
        <button class="ct-btn" id="zoomIn" title="放大">+</button>
        <button class="ct-btn" id="zoomOut" title="缩小">-</button>
        <button class="ct-btn" id="zoomReset" title="重置视图">&#10227;</button>
      </div>
      <div class="chart-hint">滚轮缩放 · 拖动平移 · 点击锁定光标 · ← → 移动选中</div>
      <div class="overlay" id="overlay"><span class="spinner"></span><span>正在获取行情数据…</span></div>
    </div>

    <div class="foot">
      本页为纯静态演示，行情数据在浏览器端实时向东方财富接口请求；交易时段内每 3 秒自动刷新报价、分时与 K 线，非交易时段标注「已收盘」。<br/>
      若接口受限或离线，会自动降级为示例数据。仅供学习与研究使用，不构成任何投资建议。
    </div>
    </section>

    <!-- 市场视图 -->
    <section id="view-market" class="view hidden">
      <div class="card">
        <h3>当日板块涨幅榜 <span class="sub">点击表头可排序 · 展开看更多</span></h3>
        <div id="tbl-sector"></div>
      </div>
      <div class="card">
        <h3>当日个股涨幅榜</h3>
        <div id="tbl-gainers"></div>
      </div>
      <div class="card">
        <h3>当日主力资金流入榜</h3>
        <div id="tbl-inflow"></div>
      </div>
    </section>

    <!-- 自选股视图 -->
    <section id="view-watch" class="view hidden">
      <div class="card">
        <h3>我的自选股 <span class="sub">最后添加排在最前</span></h3>
        <div id="tbl-watch"></div>
      </div>
    </section>
  </div>

<script>
(function(){
  "use strict";

  /* ============ 配置 ============ */
  var PRESETS = [
    {code:'600519', name:'贵州茅台'},
    {code:'300750', name:'宁德时代'},
    {code:'002594', name:'比亚迪'},
    {code:'601318', name:'中国平安'},
    {code:'600036', name:'招商银行'},
    {code:'601012', name:'隆基绿能'},
    {code:'300059', name:'东方财富'},
    {code:'000725', name:'京东方A'}
  ];
  var KLT = {day:101, week:102, month:103};
  var LMT = {day:420, week:320, month:240};   // 接口忽略 lmt，这里用作客户端展示条数上限
  var DISPLAY = {day:420, week:320, month:240};
  var C = {up:'#ef232a', down:'#00b070', ma5:'#f5c542', ma10:'#c77dff', ma20:'#4dabf7'};

  /* ============ 工具 ============ */
  function secidOf(code){
    code = (code||'').trim();
    if(!/^\d{6}$/.test(code)) return null;
    var m = (code[0]==='6') ? 1 : 0;   // 沪市 1，深市（含北交近似）0
    return m + '.' + code;
  }
  function $(id){ return document.getElementById(id); }
  function fmtPrice(v, dec){ dec = dec==null?2:dec; return (v==null||isNaN(v))?'--':Number(v).toFixed(dec); }
  function fmtPct(v){ if(v==null||isNaN(v)) return '--'; return (v>=0?'+':'') + v.toFixed(2) + '%'; }
  function fmtVol(v){
    if(v==null||isNaN(v)) return '--';
    if(v>=1e8) return (v/1e8).toFixed(2)+'亿手';
    if(v>=1e4) return (v/1e4).toFixed(2)+'万手';
    return Math.round(v)+'手';
  }
  function fmtAmount(v){
    if(v==null||isNaN(v)) return '--';
    if(v>=1e8) return (v/1e8).toFixed(2)+'亿';
    if(v>=1e4) return (v/1e4).toFixed(2)+'万';
    return Math.round(v)+'元';
  }
  function fmtCap(v){
    if(v==null||isNaN(v)) return '--';
    if(v>=1e12) return (v/1e12).toFixed(2)+'万亿';
    if(v>=1e8) return (v/1e8).toFixed(2)+'亿';
    if(v>=1e4) return (v/1e4).toFixed(2)+'万';
    return Math.round(v)+'元';
  }
  function realName(code){
    for(var i=0;i<PRESETS.length;i++){ if(PRESETS[i].code===code) return PRESETS[i].name; }
    return code;
  }
  // 是否处于 A 股交易时段（集合竞价 + 连续竞价）。近似判断：工作日 + 时段，未含法定节假日
  function isTradingNow(){
    var d=new Date(), day=d.getDay();
    if(day===0 || day===6) return false;          // 周末休市
    var t=d.getHours()*60 + d.getMinutes();
    var am = t>= 9*60+15 && t<= 11*60+30;          // 9:15 集合竞价起
    var pm = t>= 13*60   && t<= 15*60;             // 13:00 - 15:00
    return am || pm;
  }

  /* ============ 数据层 ============ */
  function parseKline(arr){
    return arr.map(function(s){
      var p = s.split(',');
      return {
        date: p[0],
        open: +p[1], close: +p[2], high: +p[3], low: +p[4],
        vol: +p[5], amount: +p[6], amp: +p[7], pct: +p[8], chg: +p[9], turnover: +p[10]
      };
    });
  }
  function fetchJSON(url, tries){
    tries = tries || 1;
    return fetch(url, {headers:{'Accept':'application/json'}}).then(function(r){ return r.json(); }).then(function(j){
      if(!j || j.data==null) throw new Error('empty');
      return j;
    }).catch(function(err){
      if(tries>1) return new Promise(function(res){ setTimeout(function(){ res(fetchJSON(url, tries-1)); }, 350); });
      throw err;
    });
  }
  function fetchKline(code, range, fqt){

      + '?secid=' + secid

      + '&klt=' + KLT[range] + '&fqt=' + (fqt==null?0:fqt) + '&beg=0&end=20500101&lmt=' + LMT[range];
    return fetchJSON(url, 2).then(function(j){
      return { name:j.data.name, code:j.data.code, decimal:j.data.decimal||2, klines:parseKline(j.data.klines) };
    });
  }
  function fetchQuote(code){

  // 离线/受限降级：随机游走生成示例 K 线
  function genDemo(code, range, n){
    var step = range==='day'?1:(range==='week'?7:30);
    var price = 60 + Math.random()*80;
    var d = new Date(); d.setDate(d.getDate() - n*step);
    var bars = [];
    for(var i=0;i<n;i++){
      var open = price;
      var drift = (Math.random()-0.48)*price*0.04;
      var close = Math.max(1, open+drift);
      var high = Math.max(open,close)*(1+Math.random()*0.02);
      var low = Math.min(open,close)*(1-Math.random()*0.02);
      var vol = Math.floor(80000+Math.random()*400000);
      bars.push({
        date: d.toISOString().slice(0,10),
        open:open, close:close, high:high, low:low,
        vol:vol, amount:vol*close*100,
        amp:(high-low)/open*100, pct:(close-open)/open*100, chg:close-open,
        turnover:Math.random()*3
      });
      price = close;
      d = new Date(d.getTime()+step*86400000);
    }
    return { name:realName(code), code:code, decimal:2, klines:bars, demo:true };
  }
  // 分时行情（当日）：东方财富 trends2 接口
  function fetchTrend(code){

      var rows=d.trends.map(function(t){

        return { time:p[0].slice(11), price:+p[1], avg:+p[2], vol:+p[5], amount:+p[6] };
      });
      return { name:d.name, code:d.code, decimal:decimal, preClose:preClose, rows:rows, demo:false };
    }).catch(function(){ return genDemoTrend(code); });
  }
  // 降级：随机游走生成当日分时
  function genDemoTrend(code){
    var preClose=80+Math.random()*40, price=preClose, rows=[], idx=0;
    var segs=[[9,30,11,30],[13,0,15,0]];
    for(var s=0;s<segs.length;s++){
      var sh=segs[s][0],sm=segs[s][1],eh=segs[s][2],em=segs[s][3];
      var cur=sh*60+sm, end=eh*60+em;
      while(cur<=end){
        var hh=Math.floor(cur/60), mm=cur%60;
        var t=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
        price=Math.max(1, price+(Math.random()-0.5)*preClose*0.004);
        var avg=price+(Math.random()-0.5)*preClose*0.002;
        var vol=(idx+1)*Math.floor(5000+Math.random()*5000);
        var amount=vol*price;
        rows.push({time:t, price:price, avg:avg, vol:vol, amount:amount});
        idx++; cur++;
      }
    }
    return { name:realName(code), code:code, decimal:2, preClose:preClose, rows:rows, demo:true };
  }

  /* ============ 均线 ============ */
  function ma(data, k){
    var out=[], sum=0;
    for(var i=0;i<data.length;i++){
      sum += data[i].close;
      if(i>=k) sum -= data[i-k].close;
      out.push(i>=k-1 ? sum/k : null);
    }
    return out;
  }

  /* ============ 图表 ============ */
  var Chart = {
    canvas:null, ctx:null, wrap:null, tip:null,
    dpr:1, cssW:0, cssH:0,
    full:[], range:'day', decimal:2, mode:'kline', preClose:null,
    showMA:{5:true,10:true,20:true},
    viewStart:0, viewEnd:0,
    hoverIndex:-1, lockedFull:-1, hoverY:0,
    dragging:false, dragStartX:0, dragStartVS:0,
    padL:10, padR:66, padT:16, padB:26, gap:10,
    raf:0, DEF_VIEW:120, MIN_VIEW:20,
    init:function(){
      this.canvas = $('chart'); this.ctx = this.canvas.getContext('2d');
      this.wrap = $('chartWrap'); this.tip = $('tip');
      var self=this;
      var ro = new ResizeObserver(function(){ self.resize(); });
      ro.observe(this.wrap);
      this.canvas.addEventListener('mousemove', function(e){ self.onMove(e); });
      this.canvas.addEventListener('mouseleave', function(){ self.onLeave(); });
      this.canvas.addEventListener('mousedown', function(e){ self.onDown(e); });
      window.addEventListener('mouseup', function(){ self.dragging=false; self.wrap.classList.remove('dragging'); });
      this.canvas.addEventListener('click', function(e){ self.onClick(e); });
      this.canvas.addEventListener('wheel', function(e){ self.onWheel(e); }, {passive:false});
      window.addEventListener('keydown', function(e){ self.onKey(e); });
      var zi=$('zoomIn'), zo=$('zoomOut'), zr=$('zoomReset');
      if(zi) zi.addEventListener('click', function(){ self.zoomAt(Math.floor(self.viewCount()/2), 0.82); });
      if(zo) zo.addEventListener('click', function(){ self.zoomAt(Math.floor(self.viewCount()/2), 1/0.82); });
      if(zr) zr.addEventListener('click', function(){ self.resetView(); });
      this.resize();
    },
    resize:function(){
      var r = this.canvas.getBoundingClientRect();
      this.cssW = r.width; this.cssH = r.height;
      this.dpr = window.devicePixelRatio||1;
      this.canvas.width = Math.round(this.cssW*this.dpr);
      this.canvas.height = Math.round(this.cssH*this.dpr);
      this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
      this.draw();
    },
    setData:function(data, decimal){
      this.mode='kline';
      this.full=data; this.decimal=decimal||2;
      var len=data.length;
      this.viewEnd=len;
      this.viewStart=Math.max(0, len - this.DEF_VIEW);
      this.lockedFull=-1; this.hoverIndex=-1;
      this.tip.classList.remove('show');
      this.draw();
    },
    // 实时刷新：替换全量数据，但保留用户当前的缩放窗口与选中线
    updateData:function(data, decimal){
      if(!data || !data.length) return;
      var len=data.length;
      if(!this.full.length){ this.setData(data, decimal||this.decimal); return; }
      var oldLen=this.full.length;
      var tailGap=oldLen-this.viewEnd;     // 视图末尾距数据末尾的偏移（通常 0，表示看最新）
      this.full=data;
      this.decimal=decimal||this.decimal;
      if(len!==oldLen){
        this.viewEnd=Math.min(len, len-tailGap);
        var vc=this.viewEnd-this.viewStart;   // 窗口宽度不变
        this.viewStart=this.viewEnd-vc;
        if(this.viewStart<0){ this.viewStart=0; this.viewEnd=vc; }
        if(this.lockedFull>=len) this.lockedFull=len-1;
      }
      this.draw();
    },
    schedule:function(){
      var self=this;
      if(this.raf) return;
      this.raf = requestAnimationFrame(function(){ self.raf=0; self.draw(); });
    },
    setTrend:function(rows, preClose, decimal){
      this.mode='trend';
      this.full=rows; this.preClose=preClose; this.decimal=decimal||2;
      var len=rows.length;
      this.viewEnd=len; this.viewStart=0;
      this.lockedFull=-1; this.hoverIndex=-1; this._oldLen=len;
      this.tip.classList.remove('show');
      this.draw();
    },
    updateTrend:function(rows, preClose, decimal){
      if(!rows || !rows.length) return;
      var len=rows.length;
      if(!this.full.length){ this.setTrend(rows, preClose, decimal); return; }
      var oldLen=this._oldLen||this.full.length;
      var tailGap=oldLen-this.viewEnd;
      this.full=rows; this.preClose=preClose; this.decimal=decimal||this.decimal;
      if(len!==oldLen){
        this.viewEnd=Math.min(len, len-tailGap);
        var vc=this.viewEnd-this.viewStart;
        this.viewStart=this.viewEnd-vc;
        if(this.viewStart<0){ this.viewStart=0; this.viewEnd=vc; }
      }
      this._oldLen=len;
      this.draw();
    },
    labelFor:function(date){
      return this.range==='day' ? date.slice(5) : date.slice(0,7);
    },
    layout:function(){
      var W=this.cssW, H=this.cssH;
      var innerW = W - this.padL - this.padR;
      var innerH = H - this.padT - this.padB;
      var volH = Math.max(56, innerH*0.22);
      var priceH = innerH - volH - this.gap;
      return {
        W:W, H:H, innerW:innerW,
        priceTop:this.padT, priceBot:this.padT+priceH,
        volTop:this.padT+priceH+this.gap, volBot:this.padT+priceH+this.gap+volH
      };
    },
    viewCount:function(){ return this.viewEnd - this.viewStart; },
    vis:function(){ return (this.viewEnd>this.viewStart) ? this.full.slice(this.viewStart, this.viewEnd) : []; },
    indexAtX:function(mx){
      var L=this.layout(), n=this.viewCount();
      if(n<=0) return -1;
      var i=Math.floor((mx-this.padL)/(L.innerW/n));
      return Math.max(0, Math.min(n-1, i));
    },
    draw:function(){
      if(this.mode==='trend') return this.drawTrend();
      var ctx=this.ctx, L=this.layout(), vis=this.vis(), n=vis.length;
      ctx.clearRect(0,0,L.W,L.H);
      if(!n) return;
      var min=Infinity,max=-Infinity,vmax=0;
      for(var i=0;i<n;i++){
        if(vis[i].low<min) min=vis[i].low;
        if(vis[i].high>max) max=vis[i].high;
        if(vis[i].vol>vmax) vmax=vis[i].vol;
      }
      var pad=(max-min)*0.06; min-=pad; max+=pad;
      var barW=L.innerW/n, padL=this.padL;
      var X=function(i){ return padL + (i+0.5)*barW; };
      var yP=function(p){ return L.priceBot - (p-min)/(max-min)*(L.priceBot-L.priceTop); };
      var yV=function(v){ return L.volBot - v/vmax*(L.volBot-L.volTop); };

      ctx.font='11px '+getMono();
      ctx.textBaseline='middle'; ctx.textAlign='left';
      for(var g=0; g<=5; g++){
        var p=min+(max-min)*g/5, y=yP(p);
        ctx.strokeStyle='rgba(255,255,255,0.05)';
        ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+L.innerW,y); ctx.stroke();
        ctx.fillStyle='#7a8295';
        ctx.fillText(p.toFixed(this.decimal), padL+L.innerW+6, y);
      }
      ctx.fillStyle='#7a8295';
      ctx.fillText(fmtVol(vmax), padL+L.innerW+6, L.volTop+8);

      var cw=Math.max(1, barW*0.66);
      for(var i2=0;i2<n;i2++){
        var d=vis[i2], x=X(i2), up=d.close>=d.open, col=up?C.up:C.down;
        ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x, yP(d.high)); ctx.lineTo(x, yP(d.low)); ctx.stroke();
        var y1=yP(d.open), y2=yP(d.close), top=Math.min(y1,y2), h=Math.max(1,Math.abs(y2-y1));
        ctx.fillRect(x-cw/2, top, cw, h);
      }

      var maColors={5:C.ma5,10:C.ma10,20:C.ma20};
      for(var k in this.showMA){
        if(!this.showMA[k]) continue;
        var arr=ma(vis, +k), mk=maColors[k];
        ctx.strokeStyle=mk; ctx.lineWidth=1.4; ctx.beginPath();
        var started=false;
        for(var i3=0;i3<n;i3++){
          if(arr[i3]==null) continue;
          var xx=X(i3), yy=yP(arr[i3]);
          if(!started){ ctx.moveTo(xx,yy); started=true; } else ctx.lineTo(xx,yy);
        }
        ctx.stroke(); ctx.lineWidth=1;
      }

      for(var i4=0;i4<n;i4++){
        var d4=vis[i4], x4=X(i4), up4=d4.close>=d4.open, col4=up4?C.up:C.down;
        ctx.fillStyle=col4; ctx.globalAlpha=0.82;
        var y4=yV(d4.vol);
        ctx.fillRect(x4-cw/2, y4, cw, L.volBot-y4);
        ctx.globalAlpha=1;
      }

      ctx.fillStyle='#7a8295'; ctx.textAlign='center'; ctx.textBaseline='top';
      var step=Math.max(1, Math.ceil(n/6));
      for(var i5=0;i5<n;i5+=step){
        ctx.fillText(this.labelFor(vis[i5].date), X(i5), L.volBot+6);
      }

      ctx.textAlign='left'; ctx.textBaseline='top';
      var lx=padL+6;
      var labels=[['MA5',ma(vis,5)[n-1],C.ma5],['MA10',ma(vis,10)[n-1],C.ma10],['MA20',ma(vis,20)[n-1],C.ma20]];
      for(var li=0; li<labels.length; li++){
        var lab=labels[li]; if(lab[1]==null) continue;
        var txt=lab[0]+' '+lab[1].toFixed(this.decimal);
        ctx.fillStyle=lab[2]; ctx.fillText(txt, lx, this.padT+2);
        lx += ctx.measureText(txt).width + 14;
      }

      var lockedVis = (this.lockedFull>=0) ? this.lockedFull-this.viewStart : -1;
      var act = this.hoverIndex>=0 ? this.hoverIndex : lockedVis;
      if(act>=0 && act<n && !this.dragging){
        var hi=act, hx=X(hi);
        var lockedMode = (this.hoverIndex<0 && lockedVis===hi);
        ctx.save();
        ctx.strokeStyle = lockedMode ? 'rgba(120,180,255,0.95)' : 'rgba(255,255,255,0.38)';
        ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(hx, L.priceTop); ctx.lineTo(hx, L.volBot); ctx.stroke();
        var hy = lockedMode ? yP(vis[hi].close) : this.hoverY;
        if(hy>=L.priceTop && hy<=L.priceBot){
          ctx.beginPath(); ctx.moveTo(padL, hy); ctx.lineTo(padL+L.innerW, hy); ctx.stroke();
          var pv = max - (hy-L.priceTop)/(L.priceBot-L.priceTop)*(max-min);
          ctx.fillStyle='#1b2230'; ctx.fillRect(padL+L.innerW, hy-9, this.padR, 18);
          ctx.fillStyle='#e6ebf2'; ctx.textAlign='left'; ctx.textBaseline='middle';
          ctx.fillText(pv.toFixed(this.decimal), padL+L.innerW+6, hy);
        }
        if(lockedMode){
          ctx.setLineDash([]); ctx.strokeStyle='rgba(120,180,255,0.95)'; ctx.lineWidth=1.5;
          ctx.beginPath(); ctx.arc(hx, yP(vis[hi].close), Math.max(4,cw), 0, Math.PI*2); ctx.stroke();
          ctx.lineWidth=1;
        }
        ctx.setLineDash([]); ctx.restore();
      }
    },
    drawTrend:function(){
      var ctx=this.ctx, L=this.layout(), vis=this.vis(), n=vis.length;
      ctx.clearRect(0,0,L.W,L.H);
      if(!n) return;
      var preC=this.preClose;
      var min=Infinity,max=-Infinity;
      for(var i=0;i<n;i++){
        if(vis[i].price<min) min=vis[i].price;
        if(vis[i].price>max) max=vis[i].price;
        if(vis[i].avg<min) min=vis[i].avg;
        if(vis[i].avg>max) max=vis[i].avg;
      }
      if(preC!=null){ if(preC<min) min=preC; if(preC>max) max=preC; }
      if(!isFinite(min)||!isFinite(max)){ min=preC||0; max=(preC||0)*1.02; }
      var pad=(max-min)*0.08; min-=pad; max+=pad;
      var barW=L.innerW/n, padL=this.padL;
      var X=function(i){ return padL+(i+0.5)*barW; };
      var yP=function(p){ return L.priceBot-(p-min)/(max-min)*(L.priceBot-L.priceTop); };
      ctx.font='11px '+getMono(); ctx.textBaseline='middle'; ctx.textAlign='left';
      for(var g=0;g<=5;g++){
        var p=min+(max-min)*g/5, y=yP(p);
        ctx.strokeStyle='rgba(255,255,255,0.05)';
        ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+L.innerW,y); ctx.stroke();
        ctx.fillStyle='#7a8295'; ctx.fillText(p.toFixed(this.decimal), padL+L.innerW+6, y);
      }
      if(preC!=null){
        var yc=yP(preC);
        ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle='rgba(255,255,255,0.45)';
        ctx.beginPath(); ctx.moveTo(padL,yc); ctx.lineTo(padL+L.innerW,yc); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
      }
      var up=vis[n-1].price>=(preC!=null?preC:vis[n-1].price);
      var col=up?C.up:C.down;
      if(preC!=null){
        ctx.beginPath();
        ctx.moveTo(X(0), yP(preC));
        for(var i0=0;i0<n;i0++) ctx.lineTo(X(i0), yP(vis[i0].price));
        ctx.lineTo(X(n-1), yP(preC));
        ctx.closePath();
        ctx.fillStyle = up ? 'rgba(239,35,42,0.12)' : 'rgba(0,176,112,0.12)';
        ctx.fill();
      }
      ctx.strokeStyle=C.ma10; ctx.lineWidth=1.2; ctx.beginPath();
      var started=false;
      for(var i1=0;i1<n;i1++){ var xx=X(i1),yy=yP(vis[i1].avg); if(!started){ctx.moveTo(xx,yy);started=true;}else ctx.lineTo(xx,yy); }
      ctx.stroke();
      ctx.strokeStyle=col; ctx.lineWidth=1.4; ctx.beginPath();
      started=false;
      for(var i2=0;i2<n;i2++){ var xx2=X(i2),yy2=yP(vis[i2].price); if(!started){ctx.moveTo(xx2,yy2);started=true;}else ctx.lineTo(xx2,yy2); }
      ctx.stroke(); ctx.lineWidth=1;
      var vmax=0, vols=[];
      for(var i3=0;i3<n;i3++){ var cv=vis[i3].vol-(i3>0?vis[i3-1].vol:0); if(cv<0)cv=0; vols.push(cv); if(cv>vmax)vmax=cv; }
      if(vmax>0){
        ctx.fillStyle='rgba(124,92,255,0.4)';
        for(var i4=0;i4<n;i4++){ var xv=X(i4), yv=L.volBot - vols[i4]/vmax*(L.volBot-L.volTop); ctx.fillRect(xv-barW/2, yv, Math.max(1,barW*0.6), L.volBot-yv); }
        ctx.fillStyle='#7a8295'; ctx.textAlign='left'; ctx.fillText(fmtVol(vmax/100), padL+L.innerW+6, L.volTop+8);
      }
      ctx.fillStyle='#7a8295'; ctx.textAlign='center'; ctx.textBaseline='top';
      var step=Math.max(1, Math.ceil(n/6));
      for(var i5=0;i5<n;i5+=step){ ctx.fillText(vis[i5].time, X(i5), L.volBot+6); }
      ctx.textAlign='left'; ctx.textBaseline='top';
      var lblP=(vis[n-1].price-preC);
      ctx.fillStyle=col;
      ctx.fillText(vis[n-1].price.toFixed(this.decimal)+'  '+(lblP>=0?'+':'')+((vis[n-1].price-preC)/preC*100).toFixed(2)+'%', padL+6, this.padT+2);
      var lockedVis=(this.lockedFull>=0)?this.lockedFull-this.viewStart:-1;
      var act=this.hoverIndex>=0?this.hoverIndex:lockedVis;
      if(act>=0 && act<n && !this.dragging){
        var hi=act, hx=X(hi);
        var lockedMode=(this.hoverIndex<0 && lockedVis===hi);
        ctx.save();
        ctx.strokeStyle=lockedMode?'rgba(120,180,255,0.95)':'rgba(255,255,255,0.38)';
        ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(hx, L.priceTop); ctx.lineTo(hx, L.volBot); ctx.stroke();
        var hy=lockedMode?yP(vis[hi].price):this.hoverY;
        if(hy>=L.priceTop && hy<=L.priceBot){
          ctx.beginPath(); ctx.moveTo(padL,hy); ctx.lineTo(padL+L.innerW,hy); ctx.stroke();
          var pv=max-(hy-L.priceTop)/(L.priceBot-L.priceTop)*(max-min);
          ctx.fillStyle='#1b2230'; ctx.fillRect(padL+L.innerW, hy-9, this.padR, 18);
          ctx.fillStyle='#e6ebf2'; ctx.textAlign='left'; ctx.textBaseline='middle';
          ctx.fillText(pv.toFixed(this.decimal), padL+L.innerW+6, hy);
        }
        if(lockedMode){
          ctx.setLineDash([]); ctx.strokeStyle='rgba(120,180,255,0.95)'; ctx.lineWidth=1.5;
          ctx.beginPath(); ctx.arc(hx, yP(vis[hi].price), Math.max(4,barW*0.6),0,Math.PI*2); ctx.stroke(); ctx.lineWidth=1;
        }
        ctx.setLineDash([]); ctx.restore();
      }
    },
    onMove:function(e){
      if(!this.full.length) return;
      var rect=this.canvas.getBoundingClientRect();
      var mx=e.clientX-rect.left, my=e.clientY-rect.top;
      var L=this.layout();
      if(this.dragging){
        var barW=L.innerW/this.viewCount();
        var moved=Math.round((mx-this.dragStartX)/barW);
        var len=this.full.length, vc=this.viewCount();
        var nvs=Math.max(0, Math.min(len-vc, this.dragStartVS - moved));
        this.viewStart=nvs; this.viewEnd=nvs+vc;
        this.hoverIndex=this.indexAtX(mx);
        this.updateTip(this.hoverIndex, {x:mx,y:my});
        this.schedule();
        return;
      }
      this.hoverIndex=this.indexAtX(mx); this.hoverY=my;
      this.updateTip(this.hoverIndex, {x:mx,y:my});
      this.schedule();
    },
    onLeave:function(){
      this.hoverIndex=-1;
      if(this.lockedFull>=0){
        var lv=this.lockedFull-this.viewStart, n=this.viewCount();
        if(lv>=0 && lv<n){ this.updateTip(lv, null); this.tip.classList.add('show'); }
        else { this.tip.classList.remove('show'); }
      } else {
        this.tip.classList.remove('show');
      }
      this.schedule();
    },
    onDown:function(e){
      if(e.button!==0) return;
      this.dragging=true;
      var rect=this.canvas.getBoundingClientRect();
      this.dragStartX=e.clientX-rect.left; this.dragStartVS=this.viewStart;
      this.wrap.classList.add('dragging');
    },
    onClick:function(e){
      if(!this.full.length) return;
      var rect=this.canvas.getBoundingClientRect();
      var mx=e.clientX-rect.left;
      var i=this.indexAtX(mx);
      if(i<0) return;
      var fullIdx=this.viewStart+i;
      this.lockedFull = (this.lockedFull===fullIdx) ? -1 : fullIdx;
      this.hoverIndex=i;
      this.updateTip(i, {x:mx, y:e.clientY-rect.top});
      this.schedule();
    },
    onWheel:function(e){
      if(!this.full.length) return;
      e.preventDefault();
      var rect=this.canvas.getBoundingClientRect();
      var mx=e.clientX-rect.left;
      var i=this.indexAtX(mx);
      this.zoomAt(i, e.deltaY<0 ? 0.82 : 1/0.82);
    },
    // 键盘左右键：移动选中的 K 线（十字线），K 线图跟随平移（游标浏览历史）
    onKey:function(e){
      if(this.lockedFull<0) return;
      if(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
      if(this.canvas.offsetParent===null) return; // 行情视图被隐藏时不响应
      var d=0;
      if(e.key==='ArrowLeft') d=-1;
      else if(e.key==='ArrowRight') d=1;
      else return;
      e.preventDefault();
      var len=this.full.length, vc=this.viewCount();
      var ni=this.lockedFull+d;
      if(ni<0 || ni>=len) return;
      this.lockedFull=ni;
      // 选中线移出可见窗口时，图表自动平移跟随；十字线随之移动
      if(ni<this.viewStart){ this.viewStart=ni; this.viewEnd=ni+vc; }
      else if(ni>=this.viewEnd){ this.viewEnd=ni+1; this.viewStart=this.viewEnd-vc; }
      if(this.viewStart<0){ this.viewStart=0; this.viewEnd=vc; }
      if(this.viewEnd>len){ this.viewEnd=len; this.viewStart=Math.max(0, len-vc); }
      this.updateTip(ni-this.viewStart, null);
      this.schedule();
    },
    zoomAt:function(anchorVis, factor){
      var len=this.full.length, vc=this.viewCount();
      if(vc<=0) return;
      var newCount=Math.round(vc*factor);
      newCount=Math.max(this.MIN_VIEW, Math.min(len, newCount));
      var anchorFull=this.viewStart+anchorVis;
      var rel=(anchorVis+0.5)/vc;
      var ns=anchorFull - Math.round(rel*(newCount-1));
      var ne=ns+newCount;
      if(ns<0){ ns=0; }
      if(ne>len){ ne=len; }
      ns=Math.max(0, Math.min(ne-newCount, ns));
      ne=ns+newCount;
      this.viewStart=ns; this.viewEnd=ne;
      this.schedule();
    },
    resetView:function(){
      var len=this.full.length;
      if(this.mode==='trend'){ this.viewEnd=len; this.viewStart=0; }
      else { this.viewEnd=len; this.viewStart=Math.max(0, len-this.DEF_VIEW); }
      this.lockedFull=-1; this.hoverIndex=-1; this.tip.classList.remove('show');
      this.schedule();
    },
    updateTip:function(visIndex, pos){
      var n=this.viewCount();
      if(visIndex<0 || visIndex>=n){ this.tip.classList.remove('show'); return; }
      var fi=this.viewStart+visIndex;
      var d=this.full[fi];
      var html, tw, th, left, top;
      if(this.mode==='trend'){
        var preC=this.preClose;
        var chg=d.price-preC, pct=preC?chg/preC*100:0;
        var col=chg>=0?'up':'down';
        html='<div class="t-date">'+d.time+'</div><div class="t-grid">'
          + '<span>价</span><b class="'+col+'">'+fmtPrice(d.price,this.decimal)+'</b>'
          + '<span>均</span><b class="'+col+'">'+fmtPrice(d.avg,this.decimal)+'</b>'
          + '<span>涨跌</span><b class="'+col+'">'+fmtPct(pct)+'</b>'
          + '<span>额</span><b>'+fmtAmount(d.amount)+'</b>'
          + '</div>';
        this.tip.innerHTML=html; this.tip.classList.add('show');
        tw=this.tip.offsetWidth; th=this.tip.offsetHeight;
        var L=this.layout(), vv=this.vis(), nn=vv.length;
        var mn=Infinity,mx2=-Infinity;
        for(var z=0;z<nn;z++){ if(vv[z].price<mn)mn=vv[z].price; if(vv[z].price>mx2)mx2=vv[z].price; }
        var pp2=(mx2-mn)*0.08; mn-=pp2; mx2+=pp2;
        var bw=L.innerW/nn;
        var hx=this.padL+(visIndex+0.5)*bw;
        var hy=L.priceBot - (d.price-mn)/(mx2-mn)*(L.priceBot-L.priceTop);
        left=hx+14; top=hy+14;
        if(left+tw>this.cssW) left=hx-tw-14;
        if(top+th>this.cssH) top=this.cssH-th-6;
        if(top<0) top=6;
        this.tip.style.left=left+'px'; this.tip.style.top=top+'px';
        return;
      }
      var prev=this.full[fi-1]||d;
      var preC=prev.close;
      var chg=d.close-preC, pct=preC?chg/preC*100:0;
      var col=chg>=0?'up':'down';
      html='<div class="t-date">'+d.date+'</div><div class="t-grid">'
        + '<span>开</span><b class="'+(d.open>=preC?'up':'down')+'">'+fmtPrice(d.open,this.decimal)+'</b>'
        + '<span>高</span><b class="'+(d.high>=preC?'up':'down')+'">'+fmtPrice(d.high,this.decimal)+'</b>'
        + '<span>低</span><b class="'+(d.low>=preC?'up':'down')+'">'+fmtPrice(d.low,this.decimal)+'</b>'
        + '<span>收</span><b class="'+col+'">'+fmtPrice(d.close,this.decimal)+'</b>'
        + '<span>涨跌</span><b class="'+col+'">'+fmtPct(pct)+'</b>'
        + '<span>量</span><b>'+fmtVol(d.vol)+'</b>'
        + '</div>';
      this.tip.innerHTML=html;
      this.tip.classList.add('show');
      tw=this.tip.offsetWidth; th=this.tip.offsetHeight;
      if(pos){
        left=pos.x+14; top=pos.y+14;
        if(left+tw>this.cssW) left=pos.x-tw-14;
        if(top+th>this.cssH) top=this.cssH-th-6;
        if(top<0) top=6;
      } else {
        var L2=this.layout(), vv2=this.vis(), nn2=vv2.length;
        var mn2=Infinity,mx3=-Infinity;
        for(var z2=0;z2<nn2;z2++){ if(vv2[z2].low<mn2)mn2=vv2[z2].low; if(vv2[z2].high>mx3)mx3=vv2[z2].high; }
        var pp3=(mx3-mn2)*0.06; mn2-=pp3; mx3+=pp3;
        var bw2=L2.innerW/nn2;
        var hx2=this.padL+(visIndex+0.5)*bw2;
        var hy2=L2.priceBot - (d.close-mn2)/(mx3-mn2)*(L2.priceBot-L2.priceTop);
        left=hx2+14; top=hy2+14;
        if(left+tw>this.cssW) left=hx2-tw-14;
        if(top+th>this.cssH) top=this.cssH-th-6;
        if(top<0) top=6;
      }
      this.tip.style.left=left+'px';
      this.tip.style.top=top+'px';
    }
  };

    startRealtime:function(){

      // 仅按间隔轮询；刚发起 load 时已拉过一次数据，避免重复请求
      this._timer=setInterval(function(){ self.tickRealtime(); }, this.REALTIME_MS);

    tickRealtime:function(){
      if(!this.code) return;
      if(document.hidden) return;                       // 标签页隐藏时不请求，省流量
      if(this._curView!=='quote') return;               // 仅行情视图刷新

        if(range==='min'){ self.updateRealtimeTrend(d); } else { self.updateRealtime(d); }

      $('qCode').innerHTML=info.code+' <span class="mkt">'+(info.code[0]==='6'?'沪市':'深市')+'</span>';
      var pEl=$('qPrice'), cEl=$('qChg');
      pEl.textContent=fmtPrice(price, info.decimal);
      pEl.className='q-price '+(chg>=0?'up':'down');
      cEl.textContent=fmtPct(chg)+'  '+fmtPct(pct);
      cEl.className='q-chg '+(chg>=0?'up':'down');
      var hi=-1e9, lo=1e9;
      for(var i=0;i<rows.length;i++){ if(rows[i].price>hi)hi=rows[i].price; if(rows[i].price<lo)lo=rows[i].price; }
      var stats=[
        ['昨收', fmtPrice(preC, info.decimal), ''],
        ['最高', fmtPrice(hi, info.decimal), hi>=preC?'up':'down'],
        ['最低', fmtPrice(lo, info.decimal), lo>=preC?'up':'down'],
        ['均价', fmtPrice(last.avg, info.decimal), last.avg>=preC?'up':'down'],
        ['成交量', fmtVol(last.vol/100), ''],
        ['成交额', fmtAmount(last.amount), '']
      ];
      if(info.quote){
        if(info.quote.pe!=null) stats.push(['市盈率TTM', info.quote.pe.toFixed(2), '']);
        if(info.quote.totalCap!=null) stats.push(['总市值', fmtCap(info.quote.totalCap), '']);
        if(info.quote.floatCap!=null) stats.push(['流通市值', fmtCap(info.quote.floatCap), '']);
      }
      $('stats').innerHTML = stats.map(function(s){
        return '<div class="stat"><span class="s-label">'+s[0]+'</span>'
          + '<span class="s-val '+(s[2]||'')+'">'+s[1]+'</span></div>';
      }).join('');
      Chart.range=this.range;
      Chart.setTrend(rows, preC, info.decimal);
      this.bindWatchBtn(info);
    },
    bindWatchBtn:function(info){
      var wb=$('watchBtn');
      if(wb){
        wb.onclick=function(){
          toggleWatch(info.code, info.name);
          App.refreshWatchBtn(info.code);
          if($('view-watch') && !$('view-watch').classList.contains('hidden')) App.loadWatch();
        };
      }
      this.refreshWatchBtn(info.code);
    }
  };

  /* ============ 自选 / 最近搜索 · 本地存储 ============ */
  function lsGet(k, def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  var RECENTS_KEY='mf_recents', WATCH_KEY='mf_watch';
  function getRecents(){
    var r=lsGet(RECENTS_KEY, null);
    if(!r || !r.length){ r=PRESETS.map(function(p){ return {code:p.code, name:p.name}; }); lsSet(RECENTS_KEY, r); }
    return r;
  }
  function addRecent(code, name){
    var r=getRecents().filter(function(x){ return x.code!==code; });
    r.unshift({code:code, name:name||realName(code)});
    if(r.length>10) r=r.slice(0,10);
    lsSet(RECENTS_KEY, r);
  }
  function removeRecent(code){ lsSet(RECENTS_KEY, getRecents().filter(function(x){ return x.code!==code; })); }
  function getWatch(){ return lsGet(WATCH_KEY, []); }
  function inWatch(code){ return getWatch().some(function(x){ return x.code===code; }); }
  function addWatch(code, name){
    var w=getWatch();
    if(w.some(function(x){ return x.code===code; })) return;
    w.unshift({code:code, name:name||realName(code), ts:Date.now()});
    lsSet(WATCH_KEY, w);
  }
  function removeWatch(code){ lsSet(WATCH_KEY, getWatch().filter(function(x){ return x.code!==code; })); }
  function toggleWatch(code, name){ if(inWatch(code)) removeWatch(code); else addWatch(code, name); }
  function signOf(v){ return v>=0 ? 'up' : 'down'; }
  function fmtCapFlow(v){
    if(v==null || isNaN(v)) return '--';
    var neg=v<0; v=Math.abs(v);
    var s = v>=1e8 ? (v/1e8).toFixed(2)+'亿' : (v/1e4).toFixed(2)+'万';
    return (neg?'':'+')+s;
  }
  // 逐只实时报价（自选股用）
  function fetchQuoteLight(code){
    var secid=secidOf(code);
    var url='https://push2.eastmoney.com/api/qt/stock/get?secid='+secid+'&fields=f43,f57,f58,f170&fltt=2';
    return fetchJSON(url, 2).then(function(j){
      if(!j.data || j.data.f43==null) throw new Error('empty');
      return {code:j.data.f57, name:j.data.f58, price:j.data.f43, pct:j.data.f170};
    });
  }
  // 排行榜列表（板块 / 个股 / 资金）
  function fetchClist(fs, fields, fid, po){
    var url='https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=20&po='+(po==null?1:po)
      + '&np=1&fltt=2&invt=2&fs='+encodeURIComponent(fs)+'&fields='+fields+'&fid='+fid;
    return fetchJSON(url, 2).then(function(j){
      if(!j.data || !j.data.diff) throw new Error('empty');
      return j.data.diff;
    });
  }

  /* ============ 通用可排序表格 ============ */
  var Tables = {
    inst:{},
    init:function(id, cfg){
      this.inst[id]=Object.assign({rows:[], manual:false, sortKey:cfg.defaultKey||null,
        sortDir:cfg.defaultDir||'desc', expanded:false}, cfg);
      this.render(id);
    },
    setRows:function(id, rows){ var t=this.inst[id]; if(!t) return; t.rows=rows||[]; this.render(id); },
    sortedRows:function(t){
      if(!t.sortKey) return t.rows;
      var k=t.sortKey, dir=t.sortDir==='asc'?1:-1;
      return t.rows.slice().sort(function(a,b){
        var x=a[k], y=b[k];
        if(x==null) x=-Infinity; if(y==null) y=-Infinity;
        return (x-y)*dir;
      });
    },
    render:function(id){
      var t=this.inst[id]; if(!t) return;
      var el=$(t.el); if(!el) return;
      var rows=this.sortedRows(t);
      var cap = t.collapse ? (t.expanded ? t.expandedCount : t.collapsedCount) : rows.length;
      var vis=rows.slice(0, Math.min(rows.length, cap));
      var self=this;
      var head='<tr><th class="rank">'+(t.manual ? '<button class="cancel-sort" data-id="'+id+'">取消排序</button>' : '#')+'</th>';
      t.columns.forEach(function(c){
        var active=t.sortKey===c.key;
        var cls='th'+(c.sortable?' sortable':'')+(active?' active':'');
        var arrow=active ? (' <span class="arrow">'+(t.sortDir==='asc'?'▲':'▼')+'</span>') : '';
        head+='<th class="'+cls+'"'+(c.sortable?' data-id="'+id+'" data-key="'+c.key+'"':'')+'>'+c.label+arrow+'</th>';
      });
      head+='</tr>';
      var body='';
      if(!vis.length){
        body='<tr class="tbl-empty"><td colspan="'+(t.columns.length+1)+'">暂无数据</td></tr>';
      }
      vis.forEach(function(r, i){
        var navCls=r.nav?'nav':'';
        var tds='<td class="rank">'+(i+1)+'</td>';
        t.columns.forEach(function(c){
          var txt = c.fmt ? c.fmt(r[c.key], r) : (r[c.key]==null?'--':r[c.key]);
          var tdcls='td'+(c.align==='right'?' num':'')+(c.cls?(' '+c.cls(r)):'');
          tds+='<td class="'+tdcls+'">'+txt+'</td>';
        });
        body+='<tr class="'+navCls+'"'+(r.code?' data-code="'+r.code+'"':'')+'>'+tds+'</tr>';
      });
      if(t.collapse && rows.length>t.collapsedCount){
        var label = t.expanded ? '收起 ▲'
          : ('展开全部 '+(rows.length>t.expandedCount?t.expandedCount:t.collapsedCount)+' / 共'+rows.length+' ▼');
        body+='<tr class="expand-row" data-id="'+id+'"><td colspan="'+(t.columns.length+1)+'">'+label+'</td></tr>';
      }
      el.innerHTML='<table class="mkt-table"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
      el.querySelectorAll('th.sortable').forEach(function(th){
        th.addEventListener('click', function(){ self.headerClick(id, th.dataset.key); });
      });
      var cs=el.querySelector('.cancel-sort');
      if(cs) cs.addEventListener('click', function(e){ e.stopPropagation(); self.cancel(id); });
      var ex=el.querySelector('.expand-row');
      if(ex) ex.addEventListener('click', function(){ self.toggleExpand(id); });
      el.querySelectorAll('tr.nav').forEach(function(tr){
        tr.addEventListener('click', function(){ App.load(tr.dataset.code); App.switchView('quote'); });
      });
      if(t.allowDel){
        el.querySelectorAll('.row-del').forEach(function(d){
          d.addEventListener('click', function(e){ e.stopPropagation(); removeWatch(d.getAttribute('data-code')); App.loadWatch(); });
        });
      }
    },
    headerClick:function(id, key){
      var t=this.inst[id]; if(!t) return;
      if(t.sortKey===key){ t.sortDir = t.sortDir==='desc'?'asc':'desc'; }
      else { t.sortKey=key; t.sortDir='desc'; }
      t.manual=true; this.render(id);
    },
    cancel:function(id){
      var t=this.inst[id]; if(!t) return;
      t.manual=false; t.sortKey=t.defaultKey||null; t.sortDir=t.defaultDir||'desc'; this.render(id);
    },
    toggleExpand:function(id){ var t=this.inst[id]; if(!t) return; t.expanded=!t.expanded; this.render(id); }
  };

  /* ============ 视图切换 / 市场 / 自选 ============ */
  App.initTables=function(){
    Tables.init('sector', {el:'tbl-sector', collapse:true, collapsedCount:5, expandedCount:20, defaultKey:'pct', defaultDir:'desc',
      columns:[
        {key:'name', label:'板块名称', sortable:false},
        {key:'pct', label:'涨跌幅', sortable:true, align:'right', fmt:fmtPct, cls:function(r){ return signOf(r.pct); }}
      ]});
    Tables.init('gainers', {el:'tbl-gainers', collapse:true, collapsedCount:5, expandedCount:20, defaultKey:'pct', defaultDir:'desc',
      columns:[
        {key:'name', label:'名称', sortable:false, nav:true},
        {key:'price', label:'最新价', sortable:true, align:'right', fmt:fmtPrice},
        {key:'pct', label:'涨幅', sortable:true, align:'right', fmt:fmtPct, cls:function(r){ return signOf(r.pct); }}
      ]});
    Tables.init('inflow', {el:'tbl-inflow', collapse:true, collapsedCount:5, expandedCount:20, defaultKey:'cap', defaultDir:'desc',
      columns:[
        {key:'name', label:'名称', sortable:false, nav:true},
        {key:'price', label:'最新价', sortable:true, align:'right', fmt:fmtPrice},
        {key:'cap', label:'主力净流入', sortable:true, align:'right', fmt:fmtCapFlow, cls:function(r){ return signOf(r.cap); }},
        {key:'pct', label:'涨幅', sortable:true, align:'right', fmt:fmtPct, cls:function(r){ return signOf(r.pct); }}
      ]});
    Tables.init('watch', {el:'tbl-watch', collapse:true, collapsedCount:5, expandedCount:20, defaultKey:null, defaultDir:'desc', allowDel:true,
      columns:[
        {key:'name', label:'名称', sortable:false, nav:true},
        {key:'price', label:'最新价', sortable:true, align:'right', fmt:fmtPrice},
        {key:'pct', label:'涨幅', sortable:true, align:'right', fmt:fmtPct, cls:function(r){ return signOf(r.pct); }},
        {key:'__del', label:'', sortable:false, fmt:function(v, r){ return '<span class="row-del" data-code="'+r.code+'" title="移出自选">&times;</span>'; }}
      ]});
  };
  App.loadMarket=function(){
    var self=this;
    Promise.all([
      fetchClist('m:90+t:2', 'f12,f14,f3,f62', 'f3', 1).then(function(d){ return d.map(function(x){ return {name:x.f14, pct:x.f3}; }); }),
      fetchClist('m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23', 'f12,f14,f2,f3', 'f3', 1).then(function(d){ return d.map(function(x){ return {code:x.f12, name:x.f14, price:x.f2, pct:x.f3, nav:true}; }); }),
      fetchClist('m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23', 'f12,f14,f2,f3,f62', 'f62', 1).then(function(d){ return d.map(function(x){ return {code:x.f12, name:x.f14, price:x.f2, pct:x.f3, cap:x.f62, nav:true}; }); })
    ]).then(function(res){
      Tables.setRows('sector', res[0]);
      Tables.setRows('gainers', res[1]);
      Tables.setRows('inflow', res[2]);
      self.flashStatus('实时 · 东方财富', 'live');
    }).catch(function(){
      self.flashStatus('市场数据获取失败（接口受限）', 'demo');
    });
  };
  App.loadWatch=function(){
    var w=getWatch();
    if(!w.length){ Tables.setRows('watch', []); return; }
    Promise.all(w.map(function(it){
      return fetchQuoteLight(it.code)
        .then(function(q){ return {code:it.code, name:q.name||it.name, price:q.price, pct:q.pct, nav:true}; })
        .catch(function(){ return {code:it.code, name:it.name, price:null, pct:null, nav:true}; });
    })).then(function(rows){ Tables.setRows('watch', rows); });
  };
  App.switchView=function(view){
    this._curView=view;
    ['quote','market','watch'].forEach(function(v){
      var sec=$('view-'+v); if(sec) sec.classList.toggle('hidden', v!==view);
    });
    var nav=$('mainnav');
    if(nav) nav.querySelectorAll('.mnav-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.view===view); });
    if(view==='market') this.loadMarket();
    if(view==='watch') this.loadWatch();
    if(view==='quote'){
      Chart.resize();
      if(this.code && !this.info.demo) this.startRealtime();
    } else {
      this.stopRealtime();
    }
  };
  App.refreshWatchBtn=function(code){
    var wb=$('watchBtn'); if(!wb) return;
    var w=inWatch(code);
    wb.textContent = w ? '移出自选' : '加自选';
    wb.classList.toggle('in', w);
  };

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', function(){ App.init(); });
  } else { App.init(); }
})();
</script>
